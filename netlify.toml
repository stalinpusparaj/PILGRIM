# Static site for the Play Store privacy policy and support page (publish only privacy/).
[build]
  publish = "privacy"
  command = "echo 'No build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
